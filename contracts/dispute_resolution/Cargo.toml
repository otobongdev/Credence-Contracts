[package]
name = "dispute_resolution"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` is required so the integration tests in `tests/` can link the crate.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]